<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIGC 图像质量评测看板</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --series-4: #eda100; --series-5: #e87ba4;
    --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #5598e7; --seq-4: #256abf; --seq-5: #0d366b;
    --heat-ink-1: #0b0b0b; --heat-ink-2: #0b0b0b; --heat-ink-3: #fff; --heat-ink-4: #fff; --heat-ink-5: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --series-4: #c98500; --series-5: #d55181;
      --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
      --heat-ink-1: #f0efec; --heat-ink-2: #f0efec; --heat-ink-3: #0b0b0b; --heat-ink-4: #0b0b0b; --heat-ink-5: #0b0b0b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --series-4: #c98500; --series-5: #d55181;
    --seq-1: #184f95; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
    --heat-ink-1: #f0efec; --heat-ink-2: #f0efec; --heat-ink-3: #0b0b0b; --heat-ink-4: #0b0b0b; --heat-ink-5: #0b0b0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }
  header { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 22px; }
  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--ink-2); }
  header .spacer { flex: 1; }
  .theme { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin: 14px 0; }
  .hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; align-items: stretch; }
  .hero .figure { font-size: 56px; line-height: 1; font-weight: 650; letter-spacing: -.03em; margin: 8px 0 4px; }
  .hero .sub { color: var(--ink-2); }
  .hero .ci { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface); }
  .kpi .label { color: var(--ink-2); font-size: 12px; }
  .kpi .value { font-size: 24px; font-weight: 650; margin-top: 2px; }
  .kpi .note { color: var(--muted); font-size: 11px; margin-top: 2px; }
  h2 { font-size: 15px; margin: 0 0 4px; letter-spacing: -.01em; }
  .section-note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 8px 8px; white-space: nowrap; }
  td { border-bottom: 1px solid var(--grid); padding: 8px 8px; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .bar { height: 8px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 1px; }
  .bar-track { background: var(--grid); border-radius: 0 4px 4px 0; height: 8px; overflow: hidden; }
  .bar-cell { min-width: 90px; }
  .heat { text-align: center; font-variant-numeric: tabular-nums; border-radius: 4px; }
  .heat-1 { background: var(--seq-1); color: var(--heat-ink-1); }
  .heat-2 { background: var(--seq-2); color: var(--heat-ink-2); }
  .heat-3 { background: var(--seq-3); color: var(--heat-ink-3); }
  .heat-4 { background: var(--seq-4); color: var(--heat-ink-4); }
  .heat-5 { background: var(--seq-5); color: var(--heat-ink-5); }
  .heat-0 { background: transparent; color: var(--muted); }
  .legend { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 11px; margin-top: 8px; }
  .legend span.sw { width: 22px; height: 10px; border-radius: 3px; display: inline-block; }
  .matrix td, .matrix th { text-align: center; }
  .matrix td:first-child, .matrix th:first-child { text-align: left; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .stat .label { color: var(--ink-2); font-size: 12px; }
  .stat .value { font-size: 22px; font-weight: 650; }
  .muted { color: var(--muted); }
  .warn { color: var(--warning); }
  .bad { color: var(--critical); }
  ul.limits { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }
  ul.limits li { margin: 4px 0; }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; }
  .empty { color: var(--muted); padding: 24px 0; }
  @media (max-width: 860px) {
    .hero, .two { grid-template-columns: 1fr; }
    .kpis, .stat-row { grid-template-columns: 1fr 1fr; }
    .wrap { padding: 18px 14px 40px; }
    .hero .figure { font-size: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AIGC 图像质量评测看板</h1>
      <p>多模态数据质量评估与运营复现 · 即梦 / 可灵 / Seedream API</p>
    </div>
    <div class="spacer"></div>
    <button class="theme" id="theme">切换主题</button>
  </header>

  <div id="app"></div>
  <footer id="footer"></footer>
</div>

<script src="data.js"></script>
<script>
(function () {
  const d = window.DASHBOARD_DATA;
  const app = document.getElementById("app");
  const footer = document.getElementById("footer");
  if (!d) {
    app.innerHTML = '<div class="card empty">还没有 data.js。先运行 <code>python -m src.pipeline.analyze</code> 或 <code>python -m src.pipeline.build_dashboard</code>。</div>';
    return;
  }

  const fmt = (v, n = 2) => (v === null || v === undefined || Number.isNaN(Number(v))) ? "—" : Number(v).toFixed(n);
  const pct = (v) => (v === null || v === undefined || Number.isNaN(Number(v))) ? "—" : (Number(v) * 100).toFixed(1) + "%";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const series = (i) => `var(--series-${Math.min(i + 1, 5)})`;

  function heatClass(v, min = 1, max = 5) {
    if (v === null || v === undefined || Number.isNaN(Number(v))) return "heat-0";
    const t = (Number(v) - min) / (max - min);
    if (t < .2) return "heat-1";
    if (t < .4) return "heat-2";
    if (t < .6) return "heat-3";
    if (t < .8) return "heat-4";
    return "heat-5";
  }

  function heatCell(v, min = 1, max = 5, digits = 2) {
    return `<td class="heat ${heatClass(v, min, max)}">${fmt(v, digits)}</td>`;
  }

  function barCell(v, max, digits = 0) {
    const width = (v === null || v === undefined || !max) ? 0 : Math.max(2, Math.min(100, Number(v) / max * 100));
    return `<td class="bar-cell"><div style="display:flex;align-items:center;gap:8px">
      <div style="flex:1"><div class="bar-track"><div class="bar" style="width:${width}%"></div></div></div>
      <span style="min-width:34px;text-align:right">${fmt(v, digits)}</span>
    </div></td>`;
  }

  function renderHero() {
    const lb = d.leaderboard || [];
    const best = lb.length ? lb[0] : null;
    const kpis = [
      { label: "人工标注图", value: d.meta?.n_human ?? "—", note: "human gold" },
      { label: "评测通路", value: (d.meta?.platforms || []).length || "—", note: (d.meta?.platforms || []).join(" / ") },
      { label: "人工重测", value: d.human_retest?.available ? pct(d.human_retest.by_dim?.g3?.adjacent) : "—", note: "g3 ±1 一致率" },
      { label: "Human–VLM α", value: d.human_vlm?.available ? fmt(avgAlpha(d.human_vlm)) : "—", note: "g1/g2/g3 平均" },
    ];
    return `<div class="card hero">
      <div>
        <div class="kpi label">最高综合质量</div>
        <div class="figure">${best ? fmt(best.quality_mean) : "—"}</div>
        <div class="sub">${best ? `<span class="dot" style="background:${series(0)}"></span>${esc(best.platform)}` : "暂无数据"}</div>
        <div class="ci">${best ? `95% CI ${fmt(best.quality_ci?.[0])} – ${fmt(best.quality_ci?.[1])} · N=${best.n}` : ""}</div>
      </div>
      <div class="kpis">${kpis.map(k => `<div class="kpi"><div class="label">${k.label}</div><div class="value">${esc(k.value)}</div><div class="note">${esc(k.note)}</div></div>`).join("")}</div>
    </div>`;
  }

  function avgAlpha(hv) {
    const vals = ["g1","g2","g3"].map(k => hv.by_dim?.[k]?.alpha).filter(v => v !== null && v !== undefined);
    return vals.length ? vals.reduce((a,b)=>a+Number(b),0)/vals.length : null;
  }

  function renderLeaderboard() {
    const lb = d.leaderboard || [];
    if (!lb.length) return '<div class="card empty">暂无榜单数据。</div>';
    const rows = lb.map((r, i) => `<tr>
      <td><span class="dot" style="background:${series(i)}"></span>${esc(r.platform)}</td>
      <td><strong>${fmt(r.quality_mean)}</strong></td>
      <td class="muted">${fmt(r.quality_ci?.[0])} – ${fmt(r.quality_ci?.[1])}</td>
      <td>${pct(r.constraint_pass)}</td>
      <td>${pct(r.first_pass)}</td>
      <td>${fmt(r.latency_s, 1)}</td>
      <td>${r.n ?? "—"}</td>
    </tr>`).join("");
    const sw = d.scene_weighted?.scores;
    const swLine = sw ? `<p class="section-note" style="margin-top:10px">场景加权（电商 40% / 社媒 35% / 人像 25%）：
      ${Object.entries(sw).map(([k, v]) => `<strong>${esc(k)}</strong> ${fmt(v)}`).join(" · ")}</p>` : "";
    const fr = d.friedman?.available
      ? `<p class="section-note" style="margin-top:6px">Friedman p=${fmt(d.friedman.p, 3)}；${d.friedman.p > 0.05 ? "整体差异不显著，结论为方向性。" : "整体差异显著。"}</p>`
      : "";
    return `<div class="card">
      <h2>平台榜单</h2>
      <p class="section-note">综合质量 = 0.35×指令遵循 + 0.30×视觉质量 + 0.35×商业可用性；置信区间按 prompt 聚类 bootstrap。</p>
      <table>
        <thead><tr><th>平台</th><th>综合质量</th><th>95% CI</th><th>约束满足率</th><th>一次通过率</th><th>延迟(s)</th><th>N</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${swLine}${fr}
    </div>`;
  }

  function renderHeatmap(title, note, data) {
    if (!data || !data.platforms?.length || !data.categories?.length) return `<div class="card"><h2>${title}</h2><div class="empty">暂无数据。</div></div>`;
    const head = `<th>类别</th>` + data.platforms.map(p => `<th>${esc(p)}</th>`).join("");
    const rows = data.categories.map(c => `<tr><td>${esc(c)}</td>` + data.platforms.map(p => heatCell(data.matrix?.[p]?.[c], 1, 5)).join("") + `</tr>`).join("");
    return `<div class="card">
      <h2>${title}</h2><p class="section-note">${note}</p>
      <table class="matrix"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
      ${legend()}
    </div>`;
  }

  function legend() {
    return `<div class="legend"><span>低</span>
      <span class="sw heat-1"></span><span class="sw heat-2"></span><span class="sw heat-3"></span><span class="sw heat-4"></span><span class="sw heat-5"></span>
      <span>高</span><span style="margin-left:8px">1–5 分</span></div>`;
  }

  function renderWinRate() {
    const w = d.win_rate;
    if (!w || !w.platforms?.length || w.n_prompts === 0) return `<div class="card"><h2>两两胜率</h2><div class="empty">暂无足够数据。</div></div>`;
    const head = `<th>胜率</th>` + w.platforms.map(p => `<th>${esc(p)}</th>`).join("");
    const rows = w.platforms.map(a => `<tr><td>${esc(a)}</td>` + w.platforms.map(b => {
      if (a === b) return `<td class="heat-0">—</td>`;
      const v = w.matrix?.[a]?.[b];
      return `<td class="heat ${heatClass(v, 0, 1)}">${pct(v)}</td>`;
    }).join("") + `</tr>`).join("");
    return `<div class="card">
      <h2>两两胜率</h2>
      <p class="section-note">行平台在多少比例的 prompt 上优于列平台；按 prompt 配对比较。N=${w.n_prompts} 个 prompt。</p>
      <table class="matrix"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  function renderStability() {
    const s = d.stability || {};
    const hv = d.human_vlm || {};
    const retest = d.human_retest || {};
    const stat = (label, value, note = "") => `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="muted" style="font-size:11px">${note}</div></div>`;
    const agreementRows = ["g1","g2","g3"].map(k => {
      const e = hv.by_dim?.[k] || {};
      return `<tr><td>${k.toUpperCase()} ${k === "g1" ? "指令遵循" : k === "g2" ? "视觉质量" : "商业可用性"}</td><td>${e.n ?? "—"}</td><td>${pct(e.exact)}</td><td>${pct(e.adjacent)}</td><td>${fmt(e.alpha, 3)}</td></tr>`;
    }).join("");
    const retestRows = ["g1","g2","g3"].map(k => {
      const e = retest.by_dim?.[k] || {};
      return `<tr><td>${k.toUpperCase()}</td><td>${pct(e.exact)}</td><td>${pct(e.adjacent)}</td></tr>`;
    }).join("");
    return `<div class="two">
      <div class="card">
        <h2>稳定性</h2><p class="section-note">重复生成下的波动与排名翻转。</p>
        <div class="stat-row">
          ${stat("重复内 SD", s.available ? fmt(s.within_sd_mean) : "—", "质量分 1–5")}
          ${stat("排名翻转率", s.available ? pct(s.rank_flip_rate) : "—", `${s.rank_flip_n ?? 0} 个 prompt`)}
          ${stat("稳定性样本", s.available ? (s.rank_flip_n ?? "—") : "—", "含重复生成")}
        </div>
        <p class="muted" style="font-size:12px">${s.available ? "翻转率越高，单次生成得出的平台排名越不可靠。" : "先跑稳定性子集（6 条 prompt × 3 次）后再看。"}</p>
      </div>
      <div class="card">
        <h2>Human–VLM 一致性</h2><p class="section-note">VLM 是第二评分通道，不是第二个人工标注者。</p>
        <table><thead><tr><th>维度</th><th>N</th><th>完全一致</th><th>±1</th><th>α</th></tr></thead><tbody>${agreementRows}</tbody></table>
        <p class="warn" style="font-size:12px;margin-top:8px">α<0.67：VLM 不宜替代人工最终判定，只适合初筛。</p>
        <p class="section-note" style="margin-top:10px">人工重测（48h）</p>
        <table><thead><tr><th>维度</th><th>完全一致</th><th>±1</th></tr></thead><tbody>${retestRows}</tbody></table>
      </div>
    </div>`;
  }

  function renderBadcases() {
    const tags = d.badcases || [];
    const cf = d.constraint_failures || { total: 0, by_platform_check: [] };
    const low = d.low_scores || [];
    const tagTable = tags.length ? `<table><thead><tr><th>平台</th><th>失败标签</th><th>数量</th><th>占比</th></tr></thead><tbody>${
      tags.slice(0, 20).map(r => `<tr><td>${esc(r.platform)}</td><td>${esc(r.tag)}</td><td>${r.count}</td><td>${pct(r.rate)}</td></tr>`).join("")
    }</tbody></table>` : `<p class="empty">标注者未使用失败标签。</p>`;
    const cfTable = cf.by_platform_check?.length ? `<table><thead><tr><th>平台</th><th>未满足的原子约束</th><th>次数</th></tr></thead><tbody>${
      cf.by_platform_check.slice(0, 20).map(r => `<tr><td>${esc(r.platform)}</td><td>${esc(r.check)}</td><td>${r.count}</td></tr>`).join("")
    }</tbody></table>` : `<p class="empty">没有原子约束未满足。</p>`;
    const lowTable = low.length ? `<table><thead><tr><th>平台</th><th>Prompt</th><th>G1/G2/G3</th><th>质量</th><th>未满足约束</th><th>备注</th></tr></thead><tbody>${
      low.slice(0, 12).map(r => `<tr><td>${esc(r.platform)}</td><td>${esc(r.prompt_id)}</td><td>${r.g1}/${r.g2}/${r.g3}</td><td>${fmt(r.quality)}</td><td>${esc((r.failed_checks || []).join("；") || "—")}</td><td>${esc(r.notes || "—")}</td></tr>`).join("")
    }</tbody></table>` : `<p class="empty">暂无低分样本。</p>`;
    return `<div class="card">
      <h2>Bad Case 归因</h2>
      <p class="section-note">失败标签 + 原子约束未满足 + 最低分样本；用于规则迭代和培训案例。</p>
      <h3 style="font-size:13px;margin:12px 0 4px">失败标签</h3>${tagTable}
      <h3 style="font-size:13px;margin:16px 0 4px">原子约束未满足</h3>${cfTable}
      <h3 style="font-size:13px;margin:16px 0 4px">最低分样本</h3>${lowTable}
    </div>`;
  }

  app.innerHTML = renderHero() + renderLeaderboard()
    + renderHeatmap("类别 × 平台", "每个单元格为该类别下的平均综合质量（1–5）。", d.category)
    + renderHeatmap("业务场景 × 平台", "电商 / 社媒 / 人像三个业务场景的平均质量。", d.scene)
    + renderWinRate() + renderStability() + renderBadcases()
    + `<div class="card"><h2>方法与局限</h2><ul class="limits">${(d.limitations || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;

  footer.textContent = `生成时间：${d.meta?.generated_at || "—"} · 阶段：${d.meta?.stage || "—"} · 人工标注 ${d.meta?.n_human ?? "—"} 条 · VLM ${d.meta?.n_vlm ?? "—"} 条`;

  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    root.dataset.theme = dark ? "light" : "dark";
  });
})();
</script>
</body>
</html>
