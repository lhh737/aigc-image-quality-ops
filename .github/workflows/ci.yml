name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Check prompt set
        run: |
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("prompts/prompts_v1.csv", encoding="utf-8")))
          assert len(rows) == 30, len(rows)
          assert all(r["prompt_id"] for r in rows)
          print(f"prompts: {len(rows)}")
          PY
